# /etc/nginx/sites-available/codehub
upstream codehub_app {
    server unix:/run/codehub/codehub.sock fail_timeout=0;
}

server {
    listen 80;
    server_name codehub.example.com www.codehub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name codehub.example.com www.codehub.example.com;

    ssl_certificate     /etc/letsencrypt/live/codehub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codehub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Домашнее задание может весить до 1 ГБ.
    client_max_body_size 1100M;
    client_body_timeout 300s;

    location /static/ {
        alias /srv/codehub/app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Файлы домашних работ отдаются только приложением (с проверкой прав).
    location /media/submissions/ {
        deny all;
    }

    location /media/ {
        alias /srv/codehub/app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://codehub_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90;
    }
}
